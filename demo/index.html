<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ghostty-web</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }

      .terminal-window {
        width: 100%;
        max-width: 1000px;
        background: #1e1e1e;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }

      .title-bar {
        background: #2d2d2d;
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid #1a1a1a;
      }

      .traffic-lights {
        display: flex;
        gap: 8px;
      }

      .light {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }

      .light.red {
        background: #ff5f56;
      }

      .light.yellow {
        background: #ffbd2e;
      }

      .light.green {
        background: #27c93f;
      }

      .title {
        color: #e5e5e5;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.3px;
      }

      .connection-status {
        margin-left: auto;
        font-size: 11px;
        color: #888;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .connection-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #666;
      }

      .connection-dot.connected {
        background: #27c93f;
      }

      #terminal-container {
        height: 600px;
        padding: 16px;
        background: #1e1e1e;
        position: relative;
        overflow: hidden;
      }

      /* Ensure terminal canvas can handle scrolling */
      #terminal-container canvas {
        display: block;
      }

      @media (max-width: 768px) {
        body {
          padding: 20px 10px;
        }

        #terminal-container {
          height: 500px;
        }
      }
    </style>
  </head>
  <body>
    <div class="terminal-window">
      <div class="title-bar">
        <div class="traffic-lights">
          <span class="light red"></span>
          <span class="light yellow"></span>
          <span class="light green"></span>
        </div>
        <div class="title">ghostty-web</div>
        <div class="connection-status">
          <span class="connection-dot" id="connection-dot"></span>
          <span id="connection-text">Disconnected</span>
        </div>
      </div>
      <div id="terminal-container"></div>
    </div>

    <script type="module">
      import { FitAddon } from '../lib/addons/fit.ts';
      import { init, Terminal } from '../lib/index.ts';

      let term;
      let ws;
      let fitAddon;
      const debugInput = new URLSearchParams(window.location.search).get('debugInput') === '1';

      function logInputDebug(label, payload) {
        if (!debugInput) return;
        console.log(`[ghostty-web demo] ${label}`, payload);
      }

      function attachDomInputDebugging(element, label) {
        if (!element) return;

        element.addEventListener('keydown', (event) => {
          logInputDebug(`${label}:keydown`, {
            key: event.key,
            code: event.code,
            ctrl: event.ctrlKey,
            meta: event.metaKey,
            alt: event.altKey,
            shift: event.shiftKey,
            defaultPrevented: event.defaultPrevented,
          });
        });

        element.addEventListener('beforeinput', (event) => {
          logInputDebug(`${label}:beforeinput`, {
            inputType: event.inputType,
            data: event.data,
            isComposing: event.isComposing,
            defaultPrevented: event.defaultPrevented,
          });
        });

        element.addEventListener('paste', (event) => {
          logInputDebug(`${label}:paste`, {
            types: event.clipboardData ? [...event.clipboardData.types] : [],
            text: event.clipboardData?.getData('text/plain') ?? null,
          });
        });
      }

      function attachInputDebugging() {
        if (!debugInput || !term?.textarea) return;
        const terminalContainer = document.getElementById('terminal-container');

        logInputDebug('debug enabled', {
          hint: 'Use ?debugInput=1 to inspect keydown/beforeinput/paste/onData flow on both the terminal container and hidden textarea',
        });

        term.onKey(({ key, domEvent }) => {
          logInputDebug('onKey', {
            key,
            code: domEvent.code,
            ctrl: domEvent.ctrlKey,
            meta: domEvent.metaKey,
            alt: domEvent.altKey,
            shift: domEvent.shiftKey,
            defaultPrevented: domEvent.defaultPrevented,
          });
        });

        attachDomInputDebugging(terminalContainer, 'container');
        attachDomInputDebugging(term.textarea, 'textarea');
      }

      async function initTerminal() {
        // Initialize WASM
        await init();

        term = new Terminal({
          cursorBlink: true,
          fontSize: 14,
          fontFamily: 'Monaco, Menlo, "Courier New", monospace',
          theme: {
            background: '#1e1e1e',
            foreground: '#d4d4d4',
          },
          scrollback: 10000,
        });

        fitAddon = new FitAddon();
        term.loadAddon(fitAddon);

        term.open(document.getElementById('terminal-container'));
        fitAddon.fit();
        fitAddon.observeResize(); // Auto-fit when container resizes
        attachInputDebugging();

        // Handle window resize (for browsers that don't trigger ResizeObserver on window resize)
        window.addEventListener('resize', () => {
          fitAddon.fit();
        });

        // Handle terminal resize
        term.onResize((size) => {
          if (ws && ws.readyState === WebSocket.OPEN) {
            // Send resize as control sequence (server expects this format)
            ws.send(JSON.stringify({ type: 'resize', cols: size.cols, rows: size.rows }));
          }
        });

        // Handle user input
        term.onData((data) => {
          logInputDebug('onData', JSON.stringify(data));
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(data);
          }
        });

        window.__ghosttyDemo = {
          term,
          fitAddon,
          get websocket() {
            return ws;
          },
        };

        // Debug scrollback
        console.log('Terminal scrollback:', term.buffer?.scrollback?.length || 'N/A');
        term.onScroll((ydisp) => {
          console.log('Scroll position:', ydisp);
        });

        // Connect to PTY server - terminal is ready immediately after open()
        console.log('[Demo] Terminal ready, connecting with size:', term.cols, 'x', term.rows);
        connectWebSocket();
      }

      function connectWebSocket() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws?cols=${term.cols}&rows=${term.rows}`;

        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
          console.log('WebSocket connected');
          updateConnectionStatus(true);
        };

        ws.onmessage = (event) => {
          // Server sends raw strings, not JSON
          term.write(event.data);
        };

        ws.onerror = (error) => {
          console.error('WebSocket error:', error);
          updateConnectionStatus(false);
        };

        ws.onclose = () => {
          console.log('WebSocket disconnected');
          updateConnectionStatus(false);

          // Attempt to reconnect after 3 seconds
          setTimeout(() => {
            if (!ws || ws.readyState === WebSocket.CLOSED) {
              connectWebSocket();
            }
          }, 3000);
        };
      }

      function updateConnectionStatus(connected) {
        const dot = document.getElementById('connection-dot');
        const text = document.getElementById('connection-text');

        if (connected) {
          dot.classList.add('connected');
          text.textContent = 'Connected';
        } else {
          dot.classList.remove('connected');
          text.textContent = 'Disconnected';
        }
      }

      // Initialize on load
      initTerminal();
    </script>
  </body>
</html>
